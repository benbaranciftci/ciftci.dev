<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Baran Çiftçi. Developer and computer engineering student. Torino and Istanbul."
    />
    <title>baran çiftçi</title>
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("dna-theme");
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("reduce-motion");
        }
      })();
    </script>
    <link rel="stylesheet" href="src/styles/index.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="dna-body is-intro">
    <a class="skip-link" href="#hud">Skip to DNA</a>

    <div id="intro" class="intro">
      <div class="intro-load" id="intro-load">
        <div class="intro-ring" id="intro-ring" style="--p: 0">
          <span class="intro-pct" id="intro-pct">0%</span>
          <span class="duo intro-duo" aria-hidden="true"></span>
        </div>
        <p class="intro-skip-hint">Tap anywhere to skip</p>
      </div>
      <div class="intro-split" id="intro-split" hidden>
        <div class="intro-half intro-half-top" aria-hidden="true">
          <p class="intro-giant">baran çiftçi</p>
        </div>
        <div class="intro-half intro-half-bot">
          <h1 class="intro-giant">baran çiftçi</h1>
        </div>
      </div>
    </div>

    <div id="strand" aria-hidden="true"></div>

    <div id="world" aria-hidden="true">
      <div class="world-viewport" id="world-viewport">
        <div class="world-track" id="world-track"></div>
      </div>
    </div>

    <div id="hud" class="hud">
      <p class="hud-brand">baran çiftçi</p>
      <p class="hint" id="hint">Browse genes along the strand</p>
      <div class="hud-sync" id="sync-box">
        <span class="sync-top" id="sync-label" hidden>Contact</span>
        <p class="sync-bot" id="sync-val" aria-live="polite">
          <span class="sync-now" id="sync-now">01</span><span class="sync-sep" aria-hidden="true">/</span><span class="sync-total" id="sync-total">07</span>
        </p>
      </div>
    </div>

    <aside id="memory-panel" class="memory-panel" data-sheet="peek">
      <span class="panel-corner panel-corner-tl" aria-hidden="true"></span>
      <span class="panel-corner panel-corner-tr" aria-hidden="true"></span>
      <span class="panel-corner panel-corner-bl" aria-hidden="true"></span>
      <span class="panel-corner panel-corner-br" aria-hidden="true"></span>
      <button type="button" class="panel-grab" id="panel-grab" aria-expanded="false" aria-label="Expand details">
        <span class="panel-grab-bar" aria-hidden="true"></span>
      </button>
      <div class="panel-inner" id="panel-inner">
        <div class="panel-logo panel-slot is-collapsed" id="panel-logo">
          <img id="panel-logo-img" src="" alt="" />
        </div>
        <div class="panel-head">
          <div class="panel-head-copy">
            <p class="panel-kicker" id="panel-kicker">Gene</p>
            <h2 class="panel-title" id="panel-title">—</h2>
          </div>
        </div>
        <p class="panel-body" id="panel-body"></p>
        <dl class="panel-facts panel-slot is-collapsed" id="panel-facts"></dl>
        <a class="panel-cta panel-slot is-collapsed" id="panel-cta" href="#">Enter</a>
      </div>
    </aside>

    <footer class="bar">
      <div class="bar-left">
        <span class="duo" aria-hidden="true"></span>
        <span class="bar-label">DNA</span>
        <button type="button" class="bar-btn" id="btn-theme" aria-pressed="false">Dark</button>
      </div>
      <div class="bar-rail" id="bar-rail" role="tablist" aria-label="Genes"></div>
      <div class="bar-right">
        <button type="button" class="bar-btn" id="btn-prev" aria-label="Previous">
          <kbd>←</kbd><span class="bar-btn-text"> Prev</span>
        </button>
        <button type="button" class="bar-btn" id="btn-next" aria-label="Next">
          <kbd>→</kbd><span class="bar-btn-text"> Next</span>
        </button>
        <button type="button" class="bar-btn bar-btn-open" id="btn-select" aria-label="Open link">
          <kbd>↵</kbd><span class="bar-btn-text"> Open</span>
        </button>
      </div>
    </footer>

    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
